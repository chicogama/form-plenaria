<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Resultados da validação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/painel.css">
  <script src="js/escala.js"></script>
</head>
<body class="painel">
  <header class="topo">
    <div class="topo-int">
      <div class="topo-id">
        <span class="topo-titulo">Resultados da validação</span>
        <span class="topo-sub">TRE-AP · UNIFAP · uso do pesquisador</span>
      </div>
      <div class="tamanho" role="group" aria-label="Tamanho do texto">
        <button type="button" data-escala-acao="-1" aria-label="Diminuir o texto">A−</button>
        <span data-escala-valor aria-live="polite">100%</span>
        <button type="button" data-escala-acao="1" aria-label="Aumentar o texto">A+</button>
      </div>
    </div>
  </header>

  <main id="painel">
    <form class="controle" id="controle">
      <div class="controle-campo">
        <label for="chave">Chave das métricas</label>
        <input id="chave" type="password" autocomplete="off" spellcheck="false">
      </div>
      <button type="submit">Carregar resultados</button>
      <button type="button" class="secundario" id="atualizar" hidden>Atualizar</button>
      <p class="controle-status" id="status" aria-live="polite"></p>
    </form>
    <div id="saida"></div>
  </main>

  <div class="dica" id="dica" role="tooltip" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
